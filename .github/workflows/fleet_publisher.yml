name: SEOGRAM 24/7 Autonomous Publisher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cloud Fleet Publisher
        run: node scripts/cloud_fleet_publisher.js 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}

      - name: Commit and Push Status Updates
        run: |
          git config --global user.name "SEOGRAM Bot"
          git config --global user.email "bot@seogram.local"
          git add scripts/ posts/ index.html sitemap.xml rss.xml publish_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(fleet): continuous drip & status update [skip ci]" && git push origin main)
